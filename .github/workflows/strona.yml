# Automat GitHuba: uruchamia watchlista.py i publikuje wynik jako stronę (GitHub Pages).
name: Odśwież stronę watchlisty

on:
  schedule:
    - cron: "0 */2 * * *"   # co 2 godziny (czas UTC)
  push:
    branches: [main]        # także po każdej zmianie w repozytorium (np. w spolki.txt)
  workflow_dispatch:        # przycisk "Run workflow" do ręcznego odświeżenia

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  odswiez:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publikacja.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python watchlista.py --html _site/index.html
      - run: python newsy.py --html _site/newsy.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: publikacja
        uses: actions/deploy-pages@v4
